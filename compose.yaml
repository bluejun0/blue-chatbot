services:
  app:
    build: .
    ports:
      - "8003:8003"
    volumes:
      # 소스를 마운트해 재기동 없이 코드 수정이 반영된다.
      - .:/app
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FAQ_PATH: ${FAQ_PATH:-data/faq.yaml}
    command: uvicorn blue_chatbot.main:app --host 0.0.0.0 --port 8003 --reload

services:
  app:
    build: .
    ports:
      - "8003:8003"
    volumes:
      - .:/app
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FAQ_PATH: ${FAQ_PATH:-data/faq.yaml}
    command: uvicorn blue_chatbot.main:app --host 0.0.0.0 --port 8003 --reload
    networks: [default, coursemos-net]

networks:
  coursemos-net:
    external: true

- id: workhub-status-list
  question: 요청은 어떤 상태로 관리되나요?
  answer: 등록, 시작 전, 공수산정요청, 진행중, 보류, 확인요청(개발서버반영), 확인요청(검토완료), 확인요청(운영서버반영), 운영배포요청, 재확인필요, 처리불가, 완료를 사용합니다.
- id: workhub-priority-list
  question: 요청 우선순위는 어떻게 구분하나요?
  answer: 일반, 긴급, 중요 세 가지입니다.
- id: workhub-board
  question: 업무현황판 목록이 두 개로 나뉘어 있어요.
  answer: 블루소프트와 와이오즈 두 리스트로 구분해 관리합니다.
- id: workhub-team-list
  question: 개발담당팀에는 어떤 값이 있나요?
  answer: 블루소프트, 시스템개발, 달빛소프트, 미지정과 W > B, B > W 를 사용합니다. 팀이 지정되지 않은 요청도 있습니다.
- id: workhub-ai-difficulty
  question: 난이도 분석은 어떻게 표시되나요?
  answer: 별 1개에서 5개까지 난이도를 매기고 그렇게 판단한 근거를 함께 보여줍니다. 판정 신뢰도는 high, medium, low 로 구분합니다.
- id: workhub-assignee
  question: 요청 담당자는 어떻게 정해지나요?
  answer: 요청마다 담당자를 지정할 수 있고 누가 언제 배정했는지 함께 기록됩니다.
- id: workhub-pin-hide
  question: 특정 요청을 위로 올리거나 목록에서 빼둘 수 있나요?
  answer: 고정과 숨김을 사용할 수 있습니다. 둘 다 본인 화면에만 적용되고 다른 사람 목록에는 영향을 주지 않습니다.
- id: workhub-read
  question: 읽은 요청과 안 읽은 요청이 구분되나요?
  answer: 네. 읽은 시점이 사람별로 기록되어 본인 기준으로 구분됩니다.
- id: workhub-filter-preset
  question: 자주 쓰는 필터를 저장해 둘 수 있나요?
  answer: 네. 필터와 화면 설정을 사람별로 저장해 두고 다시 불러 쓸 수 있습니다.
- id: workhub-archived
  question: 보관된 요청은 어떻게 되나요?
  answer: 보관 표시가 붙어 기본 목록과 분리됩니다. 삭제되는 것은 아니라 내용은 그대로 남습니다.
- id: workhub-dates
  question: 요청에는 어떤 날짜가 기록되나요?
  answer: 요청일과 완료예정일, 완료일이 기록됩니다. 완료예정일은 정해지지 않은 요청도 있습니다.
- id: workhub-attachment
  question: 슬랙에 올린 첨부파일도 업무현황판에서 볼 수 있나요?
  answer: 네. 요청에 달린 첨부파일 목록이 함께 보관되어 화면에서 확인할 수 있습니다.
- id: workhub-local-edit
  question: 업무현황판에서 고친 내용이 슬랙 동기화 때 지워지지 않나요?
  answer: 지워지지 않습니다. 화면에서 고친 요청은 따로 표시해 두고 다시 동기화할 때 고친 내용을 유지합니다. 마지막 수정자와 수정 시각도 남습니다.
- id: envhub-versions
  question: EnvHub에는 어떤 버전이 등록되어 있나요?
  answer: 2.9, 3.2, 3.5, 3.9, 4.5 버전이 등록되어 있습니다. 버전이 아직 비어 있는 사이트도 있습니다.
- id: envhub-vpn
  question: 대학에 접속하려면 VPN을 꼭 써야 하나요?
  answer: 대학마다 다릅니다. HIWARE, Arcon, FortiClient, WinNGS, SecuwaySSL, Citrix 같은 접근제어 프로그램이 등록되어 있고 두 가지를 함께 쓰는 곳도 있습니다. VPN 칸이 비어 있으면 별도로 실행할 것이 없다는 뜻입니다.
- id: envhub-repo
  question: 대학 소스 저장소는 svn인가요 git인가요?
  answer: 대부분 svn이고 일부는 git입니다. EnvHub의 저장소 주소 칸에서 대학별로 확인할 수 있습니다.
- id: envhub-deploy
  question: 대학별 배포 방법은 어디서 보나요?
  answer: EnvHub의 배포 방법 칸에 대학별로 적혀 있습니다. 주의할 점은 비고 칸에 함께 기록합니다.
- id: envhub-inactive
  question: 목록에 안 보이는 대학이 있어요.
  answer: 비활성으로 처리된 사이트는 목록에서 빠집니다. 기록 자체는 지우지 않고 남겨 둡니다.
- id: envhub-open-date
  question: 그 대학을 언제부터 맡았는지 알 수 있나요?
  answer: 사업시작 또는 최초 운영오픈 시점이 대학별로 기록되어 있습니다.
- id: magazine-fields
  question: 발표 분야는 어떻게 나뉘나요?
  answer: UI/UX, Marketing, Trend, AX, Etc 다섯 가지입니다.
- id: magazine-magazines
  question: 어떤 매거진을 다루나요?
  answer: DI와 MIT Technology Review를 주로 다루고 그 밖의 출처는 Etc로 묶습니다. 주제마다 권호와 페이지, 발행 연도를 함께 기록합니다.
- id: magazine-teams
  question: 발표 주제에 팀이 붙어 있던데요.
  answer: LAB, SQUARE, APP 팀으로 구분합니다. 팀이 지정되지 않은 주제도 있습니다.
- id: magazine-scan-slot
  question: 주제에 올리는 자료 칸이 두 개로 보여요.
  answer: 자료 칸과 스캔 칸이 따로 있습니다. 각 칸에는 파일이나 링크 중 하나를 올립니다.
- id: magazine-hidden-topic
  question: 주제 목록에 안 보이는 주제가 있어요.
  answer: 구성원 화면에 노출하지 않도록 꺼 둔 주제이거나 보관 처리된 주제입니다. 두 경우 모두 선점할 수 없습니다.
- id: magazine-related-topic
  question: 비슷한 주제를 찾아볼 수 있나요?
  answer: 네. 주제마다 연관된 다른 주제가 연결되어 있어 함께 살펴볼 수 있습니다.
- id: magazine-keywords
  question: 발표 주제는 어떻게 검색하나요?
  answer: 주제마다 키워드가 함께 등록되어 있어 제목뿐 아니라 키워드로도 찾을 수 있습니다.
- id: bluelearn-sites
  question: 어떤 교육 플랫폼 강의를 신청할 수 있나요?
  answer: 인프런과 패스트캠퍼스가 등록되어 있습니다.
- id: bluelearn-category
  question: 강의 분류는 어떻게 고르나요?
  answer: 플랫폼별로 대분류와 중분류가 등록되어 있어 그중에서 고릅니다. 분류 목록은 플랫폼마다 다릅니다.
- id: bluelearn-level
  question: 강의 난이도는 어떻게 표시하나요?
  answer: 초급, 중급, 고급으로 구분합니다.
- id: bluelearn-account-type
  question: 회사 계정으로 결제한 강의도 등록하나요?
  answer: 네. 신청할 때 회사계정과 개인계정 중 하나를 고릅니다. 회사계정 건은 환급 대상이 아닙니다.
- id: bluelearn-progress
  question: 수강 진행 상태는 어떻게 관리하나요?
  answer: 시작전, 진행중, 완료로 표시하고 마지막으로 상태를 바꾼 시각이 함께 기록됩니다.
- id: bluelearn-rating
  question: 들은 강의를 평가할 수 있나요?
  answer: 강의 평가와 추천도를 각각 0.5점에서 5.0점까지 매기고 후기를 남길 수 있습니다. 입력하지 않으면 미입력으로 남고 0점으로 처리되지 않습니다.
- id: bluelearn-free-vs-zero
  question: 무료 강의와 수강료 0원은 같은 건가요?
  answer: 다릅니다. 무료 강의는 따로 표시하고 수강료 금액과는 별개로 관리합니다.
- id: bluelearn-policy-items
  question: 수강료 지원 정책에서 정할 수 있는 게 뭔가요?
  answer: 건당 상한을 두는 부분환급, 연간 환급 금액 한도, 연간 환급 건수 한도, 수강료 청구 기한 네 가지를 관리자가 각각 켜고 끄며 값을 정합니다.
- id: bluelearn-history
  question: 내 신청이 어떻게 처리됐는지 지나온 과정을 볼 수 있나요?
  answer: 네. 상태가 바뀔 때마다 바뀐 상태와 처리한 사람, 시각이 남습니다. 반려 사유나 확정된 환급액도 함께 기록됩니다.
- id: bluelearn-admin
  question: BlueLearn 승인은 누가 하나요?
  answer: 따로 지정된 BlueLearn 관리자가 승인과 반려, 환급 처리를 합니다.
- id: bluelearn-cert-file
  question: 올린 이수증 파일은 어떻게 보관되나요?
  answer: 올린 원본 파일명과 서버에 저장된 파일명을 나눠서 보관하고, 누가 언제 올렸는지 함께 기록합니다.
- id: bluelearn-catalog
  question: 회사가 지정하거나 추천하는 강의도 있나요?
  answer: 관리자가 필수 또는 추천 강의를 등록할 수 있습니다. 지정 사유와 이수 기한, 전사 대상인지 특정 대상자인지, 노출 기간을 함께 정합니다.
- id: moodleup-sources
  question: MoodleUp?은 어디서 정보를 모으나요?
  answer: 무들 트래커, GitHub, moodle.com, 개발 문서 네 곳에서 모읍니다.
- id: moodleup-item-kinds
  question: 리포트에는 어떤 종류의 항목이 담기나요?
  answer: 이슈, 릴리스, 소식, 개발 문서 변경이 담깁니다. 항목마다 원문 주소와 발행 시각이 함께 기록됩니다.
- id: moodleup-impact
  question: 항목마다 붙은 영향도는 뭔가요?
  answer: 코스모스 관점에서 얼마나 중요한지를 고, 중, 저로 판정한 값이며 그렇게 본 근거가 함께 붙습니다. 판정되지 않은 항목도 있습니다.
- id: moodleup-week
  question: 리포트는 어떤 단위로 만들어지나요?
  answer: 주 단위로 만들고 2026-W37 같은 ISO 주차로 구분합니다. 리포트마다 어느 기간을 다뤘는지 시작과 끝이 기록됩니다.
- id: moodleup-run
  question: 리포트가 몇 번 갱신됐는지 알 수 있나요?
  answer: 네. 갱신할 때마다 실행 번호와 시각, 새로 들어온 항목 수가 남습니다. 자동 실행인지 화면에서 직접 실행한 것인지도 구분됩니다.
- id: moodleup-status
  question: 리포트 상태가 partial로 보여요.
  answer: 일부 출처만 수집된 경우입니다. 모두 정상이면 ok, 수집에 실패하면 failed로 표시하고 어느 출처에서 무슨 일이 있었는지 함께 기록합니다.
- id: moodleup-updates
  question: 지난번에 본 다음에 뭐가 새로 들어왔는지 보고 싶어요.
  answer: 마지막 갱신에서 새로 들어온 항목만 따로 요약해 보여줍니다. 리포트에서 눈여겨볼 항목은 따로 표시됩니다.
- id: moodleup-note
  question: 리포트에 메모를 남길 수 있나요?
  answer: 요약 글에서 원하는 부분을 골라 형광펜을 칠하거나 북마크할 수 있고 색을 골라 메모를 붙일 수 있습니다. 누가 남긴 메모인지 함께 기록됩니다.
- id: portal-token-storage
  question: 등록한 슬랙 토큰은 안전하게 보관되나요?
  answer: 암호화해서 보관하며 저장한 뒤에는 화면에 원문이 다시 표시되지 않습니다.
